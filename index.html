<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my profile ♡</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .welcome {
      position: fixed;
      inset: 0;
      background: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .heart {
      border: none;
      background: none;
      color: white;
      font-size: 65px;
      cursor: pointer;
      transition: transform 0.3s, color 0.3s;
    }

    .heart:hover {
      transform: scale(1.2);
      color: #ffb6d5;
    }

    .welcome p {
      color: #aaa;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .profile {
      width: 330px;
      padding: 30px;
      text-align: center;
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
      box-shadow: 0 0 35px #000;
    }

    .avatar {
      width: 95px;
      height: 95px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 {
      font-size: 23px;
      margin: 8px 0;
    }

    .subtitle {
      color: #999;
      font-size: 13px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 25px 0;
    }

    .socials a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      transition: color 0.2s;
    }

    .socials a:hover {
      color: #ffb6d5;
    }

    .server {
      padding: 15px;
      background: #1b1b1b;
      border-radius: 10px;
      text-align: left;
    }

    .server small {
      color: #aaa;
    }

    .join {
      display: block;
      margin-top: 12px;
      padding: 10px;
      text-align: center;
      background: white;
      color: black;
      border-radius: 7px;
      text-decoration: none;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="welcome" id="welcome">
    <button class="heart" id="enter" aria-label="Enter website">♡</button>
    <p>CLICK THE HEART TO ENTER</p>
  </div>

  <main class="profile hidden" id="profile">
    <div class="avatar">♡</div>
    <h1>mika</h1>
    <p class="subtitle">click ♡ for socials</p>

    <div class="socials">
      <a href="#" title="Twitch">୨୧</a>
      <a href="#" title="Twitter / X">𝕏</a>
      <a href="#" title="TikTok">♪</a>
    </div>

    <div class="server">
      <strong>♡ sweet</strong><br>
      <small>✦ little corner of the internet</small>
      <a class="join" href="#">join ♡</a>
    </div>
  </main>

  <script>
    document.getElementById("enter").addEventListener("click", function () {
      document.getElementById("welcome").classList.add("hidden");
      document.getElementById("profile").classList.remove("hidden");
    });
  </script>
</body>
</html>
